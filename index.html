<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowBabe Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Shop</a>
      <a href="#contact">Contact</a>
      <div class="cart-icon" onclick="toggleCart(true)">
        🛒 <span id="cart-count">0</span>
      </div>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>Elevate Your Glow</h1>
    <p>Discover our curated collection of premium jewelry & cosmetics.</p>
    <button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
  </section>

  <!-- Products -->
  <section id="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product">
        <img src="images/lipstick.jpg" alt="Lipstick">
        <h3>Lipstick</h3>
        <p>Rs 1200</p>
        <button onclick="addToCart('Lipstick', 1200)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/ring.jpg" alt="Ring">
        <h3>Elegant Ring</h3>
        <p>Rs 2000</p>
        <button onclick="addToCart('Ring', 2000)">Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Cart Panel -->
  <div id="cart-panel">
    <div class="cart-header">
      <h2>My Cart</h2>
      <span class="close-btn">&times;</span>
    </div>
    <ul id="cart-items"></ul>
    <p id="total">Total: Rs 0</p>
    <textarea id="order-notes" placeholder="Add notes for your order..."></textarea>
    <button class="checkout-btn" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
  </div>

  <!-- Contact -->
  <section id="contact">
    <h2>Contact Us</h2>
    <p>Email: glowbabestore@gmail.com</p>
    <p>WhatsApp: +92 314 6604294</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
